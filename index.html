  <script>
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('pDate');
    dateInput.setAttribute('min', today);
    dateInput.value = today;

    const form = document.getElementById('opdForm');
    const slip = document.getElementById('slip-card');
    const submitBtn = document.getElementById('submitBtn');

    // आपका Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKM9YZDXS7gke6Si-mr0cHpXAP8EJcVE3wlk5zfqDT7oN1u06QNbFPL7My3K5npx4N/exec";

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      submitBtn.innerText = "पर्ची जनरेट हो रही है...";
      submitBtn.disabled = true;

      const selectedDate = dateInput.value;
      const savedDate = localStorage.getItem('opd_last_date');
      let currentCounter = parseInt(localStorage.getItem('opd_daily_counter') || '0', 10);

      if (savedDate !== selectedDate) {
        currentCounter = 1;
      } else {
        currentCounter += 1;
      }

      localStorage.setItem('opd_last_date', selectedDate);
      localStorage.setItem('opd_daily_counter', currentCounter);

      const token = "OPD-" + currentCounter;
      const name = document.getElementById('pName').value;
      const age = document.getElementById('pAge').value;
      const gender = document.getElementById('pGender').value;
      const phone = document.getElementById('pPhone').value;

      // Google Sheet को बिना किसी रुकावट के डेटा भेजने का सबसे सुरक्षित तरीका
      const formData = new URLSearchParams();
      formData.append("token", token);
      formData.append("name", name);
      formData.append("age", age);
      formData.append("gender", gender);
      formData.append("phone", phone);
      formData.append("date", selectedDate);

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      }).then(() => {
        document.getElementById('sToken').innerText = token;
        document.getElementById('sName').innerText = name;
        document.getElementById('sAgeGender').innerText = `${age} वर्ष / ${gender}`;
        document.getElementById('sPhone').innerText = phone;
        document.getElementById('sDate').innerText = selectedDate;

        form.style.display = 'none';
        slip.style.display = 'block';
        submitBtn.innerText = "ओपीडी पर्ची जनरेट करें";
        submitBtn.disabled = false;
      }).catch(err => {
        alert("डेटा सेव करने में समस्या आई, कृपया दोबारा प्रयास करें।");
        submitBtn.innerText = "ओपीडी पर्ची जनरेट करें";
        submitBtn.disabled = false;
      });
    });

    function newBooking() {
      form.reset();
      dateInput.value = today;
      form.style.display = 'block';
      slip.style.display = 'none';
    }
  </script>
